<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Technology MCQ Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Nunito+Sans:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page">
      <header class="top-bar">
        <div class="top-bar-content">
          <div class="controls">
            <button
              id="menu-toggle"
              class="icon-button"
              type="button"
              aria-label="Open question menu"
              aria-expanded="false"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M4 6h7M4 12h16M4 18h10"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                ></path>
              </svg>
            </button>
            <button
              id="theme-toggle"
              class="icon-button"
              type="button"
              aria-label="Toggle color mode"
            >
              <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
              </svg>
              <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
                <path
                  d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                ></path>
              </svg>
            </button>
            <button
              id="customize-toggle"
              class="icon-button"
              type="button"
              aria-label="Customize appearance"
              aria-expanded="false"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 3a9 9 0 1 0 9 9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></path>
                <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle>
              </svg>
            </button>
            <button id="reset-progress" class="ghost-button" type="button">
              Reset Progress
            </button>
          </div>
        </div>
      </header>

      <main>
        <section class="question-section">
          <div id="error-message" class="error-message" hidden></div>
          <div class="question-frame">
            <div id="question-list" class="question-list single" aria-live="polite"></div>
            <div class="question-nav">
              <button id="prev-question" class="nav-button" type="button">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M15 18l-6-6 6-6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
                Previous
              </button>
              <div class="nav-center">
                <span id="question-counter">Question 0 of 0</span>
                <span id="question-status" class="status-pill"></span>
              </div>
              <button id="next-question" class="nav-button" type="button">
                Next
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M9 6l6 6-6 6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></path>
                </svg>
              </button>
            </div>
            <div class="status-strip">
              <div class="progress-card">
                <div class="progress-top">
                  <span id="progress-count">0/0 Correct</span>
                  <span id="marked-count">0 Marked</span>
                </div>
                <div class="progress-bar">
                  <span id="progress-bar-fill"></span>
                </div>
                <div class="legend">
                  <div class="legend-item">
                    <span class="legend-dot legend-attempt"></span>
                    Attempted
                  </div>
                  <div class="legend-item">
                    <span class="legend-dot legend-correct"></span>
                    Correct
                  </div>
                  <div class="legend-item">
                    <span class="legend-dot legend-retry"></span>
                    Not correct on first try
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer">Made With &#x2764;By RANJAN</footer>
    </div>

    <div id="panel-backdrop" class="panel-backdrop" aria-hidden="true"></div>
    <aside
      id="customize-panel"
      class="customize-panel"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div class="panel-header">
        <div>
          <p class="eyebrow">Customize</p>
          <h2>Personalize Your View</h2>
        </div>
        <button id="customize-close" class="icon-button" type="button" aria-label="Close panel">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6l12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            ></path>
          </svg>
        </button>
      </div>
      <div class="panel-body">
        <div class="control-group">
          <label for="accent-color">Accent color</label>
          <input id="accent-color" type="color" value="#f08b38">
        </div>
        <div class="control-group">
          <label for="background-color">Background color</label>
          <input id="background-color" type="color" value="#f6f1ea">
        </div>
        <div class="control-group">
          <label for="surface-color">Card color</label>
          <input id="surface-color" type="color" value="#ffffff">
        </div>
        <div class="control-group">
          <label for="text-color">Font color</label>
          <input id="text-color" type="color" value="#1d1b17">
        </div>
        <div class="control-group">
          <label for="font-size">Font size</label>
          <div class="range-row">
            <input id="font-size" type="range" min="14" max="20" step="1" value="16">
            <span id="font-size-value">16px</span>
          </div>
        </div>
        <div class="control-group">
          <label for="font-family">Font family</label>
          <select id="font-family">
            <option value="IBM Plex Sans">IBM Plex Sans</option>
            <option value="Space Grotesk">Space Grotesk</option>
            <option value="Nunito Sans">Nunito Sans</option>
          </select>
        </div>
      </div>
      <div class="panel-actions">
        <button id="reset-style" class="ghost-button" type="button">
          Reset Style
        </button>
      </div>
    </aside>

    <aside
      id="nav-panel"
      class="nav-panel"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div class="panel-header">
        <div>
          <p class="eyebrow">Questions</p>
          <h2>Jump to a Question</h2>
        </div>
        <button id="nav-close" class="icon-button" type="button" aria-label="Close menu">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M18 6L6 18M6 6l12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            ></path>
          </svg>
        </button>
      </div>
      <div class="panel-body">
        <div id="nav-grid" class="nav-grid" aria-live="polite"></div>
      </div>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
